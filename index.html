<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11191F" />
  <title>Briefing Executivo | 12 de setembro de 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#11191f;--wine:#561c26;--navy:#172b49;--bg:#dae1e8;--gold:#bb9d6d;--stone:#c8b6ac;--paper:#f7f9fb;--muted:#5c6871;--line:rgba(17,25,31,.13);--shadow:0 22px 64px rgba(17,25,31,.12);--r:8px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef2f6 0%,var(--bg) 58%,#cfd7df 100%)}
    .page{width:min(1280px,calc(100vw - 28px));margin:auto;padding:18px 0 36px}.hero{position:relative;overflow:hidden;padding:28px;border-radius:var(--r);background:linear-gradient(132deg,#11191f 0%,#172b49 68%,#231c25 100%);box-shadow:var(--shadow);color:#fff}.hero:after{content:"";position:absolute;width:350px;height:350px;border:1px solid rgba(187,157,109,.35);border-radius:50%;right:-110px;top:-125px}.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.38fr .92fr;gap:22px}.brand{display:flex;align-items:center;gap:16px;margin-bottom:28px}.mark{width:62px;height:62px;border:1px solid rgba(187,157,109,.8);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:700}.kicker,.eyebrow,.label{text-transform:uppercase;font-size:11px;letter-spacing:.08em}.kicker{color:rgba(255,255,255,.65);margin-bottom:5px}.brand-name{font-size:22px;font-weight:600;line-height:1.08;max-width:19ch}.hero h1{margin:0 0 16px;font-size:clamp(34px,4.5vw,58px);line-height:1;max-width:11ch}.hero-copy{margin:0;max-width:69ch;color:rgba(255,255,255,.8);font-size:15px;line-height:1.7}.hero-side{display:grid;gap:14px}.glass{padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:var(--r);background:rgba(255,255,255,.08);backdrop-filter:blur(10px)}.glass .label{color:rgba(255,255,255,.66);margin-bottom:9px}.glass strong{display:block;font-size:17px;line-height:1.45}.glass p{margin:7px 0 0;color:rgba(255,255,255,.74);font-size:13px;line-height:1.58}
    .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:18px}.metric,.panel{border:1px solid rgba(255,255,255,.62);border-radius:var(--r);background:rgba(255,255,255,.9);box-shadow:var(--shadow)}.metric{padding:18px}.metric .label{color:var(--muted);margin-bottom:10px}.metric b{display:block;color:var(--navy);font-size:32px;line-height:1}.metric span{display:block;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.48}
    .layout{display:grid;grid-template-columns:1.16fr .84fr;gap:18px;margin-top:18px}.stack{display:grid;gap:18px}.panel{padding:21px}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:16px}.eyebrow{color:var(--wine);font-weight:700;margin-bottom:8px}.panel h2{margin:0;font-size:23px;line-height:1.14}.head-note{max-width:32ch;color:var(--muted);font-size:12px;line-height:1.55}.list{display:grid;gap:12px}.item,.event,.todo{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,#fff,rgba(247,249,251,.75))}.item{padding:15px}.item h3,.event h3,.todo h3{margin:0 0 6px;font-size:15px;line-height:1.4}.item p,.event p,.todo p{margin:0;color:var(--muted);font-size:13px;line-height:1.62}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{display:inline-flex;align-items:center;min-height:27px;padding:0 9px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.critical{color:var(--wine);background:rgba(86,28,38,.12)}.high{color:#715a32;background:rgba(187,157,109,.2)}.watch{color:var(--navy);background:rgba(23,43,73,.1)}.event{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:15px}.when{color:var(--navy);font-weight:800;font-size:13px;line-height:1.45}.todo{display:grid;grid-template-columns:19px 1fr;gap:12px;padding:14px}.box{width:18px;height:18px;border:1px solid rgba(17,25,31,.26);border-radius:4px}.owner{margin-top:7px;color:var(--wine);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.footer{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.foot{padding:18px 20px;border-radius:var(--r);background:rgba(17,25,31,.96);color:rgba(255,255,255,.76);box-shadow:var(--shadow);font-size:12px;line-height:1.68}.foot strong{color:#fff}.fade{animation:rise .55s ease both}.d2{animation-delay:.08s}.d3{animation-delay:.16s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media (hover:hover){.item,.event,.todo,.metric{transition:transform .18s ease,border-color .18s ease}.item:hover,.event:hover,.todo:hover,.metric:hover{transform:translateY(-2px);border-color:rgba(187,157,109,.55)}}
    @media(max-width:1160px){.hero-grid,.metrics,.layout,.footer{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.page{width:calc(100vw - 16px);padding:8px 0 22px}.hero,.panel,.metric{padding:18px}.hero-grid{gap:16px}.brand{margin-bottom:22px}.mark{width:52px;height:52px}.brand-name{font-size:18px}.hero h1{font-size:34px;max-width:none}.hero-copy{font-size:14px;line-height:1.64;text-wrap:pretty}.glass strong{font-size:16px}.metrics{grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.metric{min-height:126px}.metric b{font-size:29px}.layout{gap:8px;margin-top:8px}.stack{gap:8px}.panel-head{display:block}.head-note{margin-top:8px;max-width:none}.panel h2{font-size:20px}.event{grid-template-columns:1fr}.footer{gap:8px;margin-top:8px}.foot{text-wrap:pretty}}@media(max-width:420px){.metrics{grid-template-columns:1fr}.metric{min-height:auto}.hero{padding:16px}.hero h1{font-size:31px}.glass{padding:15px}.panel{padding:16px}}
  </style>
</head>
<body><main id="root"></main>
<script type="module">
  import React from "https://esm.sh/react@18.3.1";
  import {createRoot} from "https://esm.sh/react-dom@18.3.1/client";
  import htm from "https://esm.sh/htm@3.1.1";
  const html=htm.bind(React.createElement);
  const data={
    "priorities": [
      [
        "Prazo com vencimento hoje ainda sem prova de revisão independente",
        "Vinte e um alertas automáticos foram consolidados em três conversas. A data objetiva é hoje, embora parte dos avisos use a expressão 'amanhã'. Confirmar o marco no sistema oficial, concluir a revisão por quatro olhos e preservar o recibo.",
        "Crítico"
      ],
      [
        "Cliente enviou nova prova após protocolo urgente",
        "A petição de reação foi protocolada e comunicada, mas chegaram documentos adicionais sobre fato sensível que podem justificar aditamento. É preciso analisar os anexos, decidir a utilidade processual e retornar com cronograma.",
        "Crítico"
      ],
      [
        "Intimações e documentos fechados pedem leitura oficial",
        "Há publicação marcada para o próximo dia útil, despacho com intimação, múltiplos decursos e documentos sigilosos. O e-mail não revela comando, destinatário ou prazo final.",
        "Alto"
      ],
      [
        "Continuidade digital e financeira segue exposta",
        "Certificado digital com expiração hoje, licença do sistema jurídico em risco e crédito relevante sem origem formal exigem validação e evidência de regularização.",
        "Alto"
      ]
    ],
    "legal": [
      [
        "Dezesseis frentes jurídicas com sinal direto",
        "A janela reuniu prazos, publicações, intimações, decursos, conclusões, documentos sigilosos e juntada de alvará. Os registros detalhados foram atualizados no controle interno."
      ],
      [
        "Publicação no próximo dia útil",
        "Uma intimação foi disponibilizada e indicada como publicada na segunda-feira. Abrir o inteiro teor, identificar destinatário e comando e calcular a data final no calendário oficial."
      ],
      [
        "Quatro decursos em matéria de saúde",
        "O sistema registrou expiração simultânea para vários polos. A prioridade é identificar a parte representada e o efeito concreto antes de definir qualquer resposta."
      ],
      [
        "Despejo com nova prova do cliente",
        "O protocolo urgente foi confirmado; documentos complementares chegaram depois. A decisão agora é técnica: aditar, preservar para outra medida ou responder justificadamente ao cliente."
      ],
      [
        "Sinais de sistemas em conflito",
        "Um processo apontado como parado recebeu conclusão para despacho no mesmo dia. A Controladoria também indicou zero prazos, em desacordo com os alertas efetivamente recebidos."
      ],
      [
        "Alvará e crédito não conciliados",
        "Houve juntada de alvará e, separadamente, registro de entrada bancária sem remetente formal. Valores e origem devem ser conciliados antes de baixa, repasse ou prestação de contas."
      ]
    ],
    "actions": [
      [
        "Confirmar o prazo de hoje, obter quatro olhos e arquivar o recibo",
        "Responsável: Dr. Petrônio / segundo advogado · imediato"
      ],
      [
        "Revisar os novos documentos do cliente e decidir eventual aditamento",
        "Responsável: Dr. Petrônio · manhã"
      ],
      [
        "Abrir intimações, despachos e documentos sigilosos prioritários",
        "Responsável: jurídico · primeira janela útil"
      ],
      [
        "Instalar e testar o certificado digital nos sistemas judiciais",
        "Responsável: Dr. Petrônio / suporte · hoje"
      ],
      [
        "Regularizar a licença do sistema jurídico e testar continuidade",
        "Responsável: administrativo · hoje"
      ],
      [
        "Identificar a origem do crédito e reconciliar o alvará separadamente",
        "Responsável: financeiro · hoje"
      ],
      [
        "Corrigir os falsos negativos da Controladoria e do monitor de parados",
        "Responsável: operações · alta"
      ]
    ]
  };
  const Chip=({level})=>html`<span className=${"chip "+(level==="Crítico"?"critical":level==="Alto"?"high":"watch")}>${level}</span>`;
  const Panel=({eyebrow,title,note,children})=>html`<section className="panel"><div className="panel-head"><div><div className="eyebrow">${eyebrow}</div><h2>${title}</h2></div>${note&&html`<div className="head-note">${note}</div>`}</div>${children}</section>`;
  function App(){return html`<div className="page">
    <header className="hero fade"><div className="hero-grid"><div><div className="brand"><div className="mark">PS</div><div><div className="kicker">Inteligência jurídica e operacional</div><div className="brand-name">Petrônio Souza Advogados Associados</div></div></div><h1>Briefing executivo</h1><p className="hero-copy">A manhã pede fechamento de evidências: confirmar um prazo com vencimento hoje, decidir o uso de novos documentos em demanda sensível e proteger certificado, sistema jurídico e conciliação financeira. A agenda formal está livre nas próximas 48 horas, abrindo espaço para saneamento concentrado.</p></div><div className="hero-side"><div className="glass"><div className="label">Gerado em</div><strong>12 de setembro de 2026 · 07:14 BRT</strong><p>America/Sao_Paulo</p></div><div className="glass"><div className="label">Janela verificada</div><strong>11/09 07:14 → 12/09 07:14</strong><p>Agenda prospectiva até 14/09 07:14</p></div><div className="glass"><div className="label">Atenção executiva</div><strong>Prazo hoje, nova prova e continuidade operacional</strong><p>Conclusão só com ato oficial, segunda conferência e comprovante preservado.</p></div></div></div></header>
    <section className="metrics fade d2"><div className="metric"><div className="label">Mensagens</div><b>53</b><span>32 conversas após consolidação</span></div><div className="metric"><div className="label">Alertas repetidos</div><b>21</b><span>agrupados em três threads</span></div><div className="metric"><div className="label">Frentes jurídicas</div><b>16</b><span>com sinal direto na janela</span></div><div className="metric"><div className="label">Próximas 48h</div><b>0</b><span>sem eventos na Agenda formal</span></div><div className="metric"><div className="label">Controles Notion</div><b>20</b><span>19 atualizados e 1 criado</span></div></section>
    <div className="layout fade d3"><div className="stack"><${Panel} eyebrow="Agora" title="Prioridades críticas" note="Ordenadas por prazo, impacto jurídico e continuidade operacional"><div className="list">${data.priorities.map(x=>html`<article className="item"><h3>${x[0]}</h3><p>${x[1]}</p><div className="chips"><${Chip} level=${x[2]}/></div></article>`)}</div></${Panel}>
    <${Panel} eyebrow="Radar jurídico" title="Movimentos e preparação" note="Resumo sanitizado para publicação"><div className="list">${data.legal.map((x,i)=>html`<article className="item"><h3>${x[0]}</h3><p>${x[1]}</p><div className="chips"><${Chip} level=${i<2?"Alto":"Monitorar"}/></div></article>`)}</div></${Panel}></div>
    <div className="stack"><${Panel} eyebrow="Agenda" title="Próximas 48 horas" note="Compromissos confirmados na Agenda Google"><div className="list"><article className="event"><div className="when">Janela<br/>livre</div><div><h3>Nenhum evento localizado</h3><p>A Agenda formal não contém compromissos entre 12/09 às 07:14 e 14/09 às 07:14. Use o intervalo para fechar prazos, documentos, sistemas e conciliações pendentes.</p></div></article></div></${Panel}>
    <${Panel} eyebrow="Execução" title="Próximas ações" note="Ações abertas; conclusão depende de evidência"><div className="list">${data.actions.map(x=>html`<article className="todo"><div className="box"></div><div><h3>${x[0]}</h3><p>${x[1]}</p></div></article>`)}</div></${Panel}>
    <${Panel} eyebrow="Operações" title="Sinais complementares"><div className="list"><article className="item"><h3>Controladoria zerada não autoriza baixa</h3><p>O resumo automático informou ausência de contas, prazos e agenda. Gmail e sistemas processuais, porém, confirmam prazo hoje e diversos atos novos. O zero deve ser tratado como falso negativo até correção.</p></article><article className="item"><h3>CRM sem pastas pendentes</h3><p>O relatório matinal confirmou que não há clientes aguardando criação de pasta no Drive.</p></article><article className="item"><h3>Horizonte adjacente</h3><p>Relatório interno cita compromisso jurídico para a manhã de segunda-feira, fora do corte estrito das próximas 48 horas. Conferir e preparar antes do início do expediente.</p></article></div></${Panel}></div></div>
    <footer className="footer"><div className="foot"><strong>Cobertura verificada.</strong> As 53 mensagens da janela foram consolidadas em 32 conversas; a Agenda foi auditada das 24 horas passadas até as 48 horas futuras. Não há conector de chat corporativo.</div><div className="foot"><strong>Limite de evidência.</strong> Inteiro teor, representação, sigilo, termo inicial, feriados, prazo fatal e recibos devem ser confirmados nos sistemas oficiais. Esta versão pública omite dados sensíveis.</div></footer>
  </div>`}createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
