      :root {
        --bg: #dae1e8;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-strong: rgba(255, 255, 255, 0.96);
        --ink: #11191f;
        --wine: #561c26;
        --navy: #172b49;
        --gold: #bb9d6d;
        --stone: #c8b6ac;
        --muted: rgba(17, 25, 31, 0.7);
        --line: rgba(17, 25, 31, 0.12);
        --shadow: 0 24px 70px rgba(17, 25, 31, 0.12);
        --radius: 8px;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Montserrat", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 0% 0%, rgba(187, 157, 109, 0.22), transparent 28%),
          radial-gradient(circle at 100% 0%, rgba(23, 43, 73, 0.18), transparent 30%),
          linear-gradient(180deg, #eef2f6 0%, #dae1e8 58%, #ced6de 100%);
      }

      a { color: inherit; text-decoration: none; }
      #root { min-height: 100vh; }

      .page {
        width: min(1280px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 18px 0 34px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: var(--radius);
        background:
          linear-gradient(135deg, rgba(17, 25, 31, 0.98), rgba(23, 43, 73, 0.95)),
          linear-gradient(180deg, rgba(86, 28, 38, 0.18), rgba(187, 157, 109, 0.08));
        box-shadow: var(--shadow);
        padding: 26px;
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        border: 1px solid rgba(187, 157, 109, 0.3);
      }

      .hero::before {
        width: 360px;
        height: 360px;
        right: -100px;
        top: -120px;
      }

      .hero::after {
        width: 220px;
        height: 220px;
        right: 120px;
        bottom: -110px;
      }

      .hero-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.45fr 0.95fr;
        gap: 18px;
        align-items: stretch;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }

      .brand-mark {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 1px solid rgba(187, 157, 109, 0.72);
        display: grid;
        place-items: center;
        color: var(--gold);
        font-weight: 700;
        position: relative;
      }

      .brand-mark::after {
        content: "";
        position: absolute;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        border: 1px solid rgba(200, 182, 172, 0.22);
      }

      .brand-label {
        color: rgba(255, 255, 255, 0.72);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }

      .brand-name {
        color: #fff;
        font-size: 23px;
        line-height: 1.08;
        font-weight: 600;
        max-width: 18ch;
      }

      .hero h1 {
        margin: 0 0 14px;
        color: #fff;
        font-size: clamp(32px, 4.4vw, 58px);
        line-height: 0.98;
        max-width: 10ch;
      }

      .hero-copy {
        color: rgba(255, 255, 255, 0.78);
        font-size: 15px;
        line-height: 1.68;
        max-width: 64ch;
        margin: 0;
      }

      .hero-side {
        display: grid;
        gap: 14px;
      }

      .glass {
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
        padding: 18px;
      }

      .glass-label,
      .mini-label {
        color: rgba(255, 255, 255, 0.64);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }

      .glass-value {
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.4;
      }

      .glass-note {
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        line-height: 1.58;
        margin-top: 8px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .metric,
      .panel {
        border-radius: var(--radius);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: var(--shadow);
      }

      .metric { padding: 18px; }
      .metric .label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }

      .metric .value {
        color: var(--navy);
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
      }

      .metric .note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin-top: 8px;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.16fr 0.84fr;
        gap: 18px;
        margin-top: 18px;
      }

      .stack { display: grid; gap: 18px; }
      .panel { padding: 20px; background: var(--panel-strong); }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .eyebrow {
        color: var(--wine);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }

      .panel h2 {
        margin: 0;
        font-size: 24px;
        line-height: 1.1;
      }

      .head-note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        max-width: 32ch;
      }

      .list { display: grid; gap: 12px; }

      .item,
      .mail,
      .todo,
      .risk,
      .coverage,
      .event {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.62));
      }

      .item,
      .mail,
      .risk,
      .coverage { padding: 14px; }

      .title {
        margin: 0 0 6px;
        font-size: 15px;
        line-height: 1.36;
        font-weight: 700;
      }

      .body {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.62;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .chip {
        min-height: 28px;
        border-radius: 999px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .critical { background: rgba(86, 28, 38, 0.12); color: var(--wine); }
      .watch { background: rgba(187, 157, 109, 0.18); color: #7a6540; }
      .ok { background: rgba(23, 43, 73, 0.1); color: var(--navy); }

      .link {
        display: inline-flex;
        margin-top: 10px;
        font-size: 12px;
        font-weight: 700;
        color: var(--navy);
      }

      .timeline { display: grid; gap: 12px; }

      .event {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 14px;
        padding: 14px;
      }

      .when {
        font-size: 13px;
        font-weight: 700;
        color: var(--navy);
      }

      .prep {
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 7px;
      }

      .prep li {
        font-size: 13px;
        line-height: 1.56;
        padding-left: 15px;
        position: relative;
      }

      .prep li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
      }

      .mail-meta {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }

      .todo {
        padding: 14px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
      }

      .box {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 1px solid rgba(17, 25, 31, 0.22);
        margin-top: 1px;
      }

      .owner {
        margin-top: 6px;
        color: var(--wine);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .footer {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .footer-note {
        padding: 18px 20px;
        border-radius: var(--radius);
        background: rgba(17, 25, 31, 0.95);
        color: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow);
        font-size: 13px;
        line-height: 1.66;
      }

      .footer-note strong { color: #fff; }

      @media (max-width: 1160px) {
        .hero-grid, .metrics, .layout, .footer { grid-template-columns: 1fr; }
      }

      @media (max-width: 760px) {
        .page { width: min(100vw - 16px, 1280px); }

        .event { grid-template-columns: 1fr; }
        .brand-name { font-size: 19px; }
        .panel h2 { font-size: 21px; }
      }
    </style>
  </head>

                          ${item.tags.map(([text, variant]) => chip(text, variant))}
                        </div>
                        ${item.href && html`<a className="link" href=${item.href} target="_blank" rel="noreferrer">${item.label}</a>`}
                      </article>
                    `
                  )}
                </div>
              </section>

              <section className="panel">
                <div className="panel-head">
                  <div>
                    <div className="eyebrow">Próximas 48 horas</div>
                    <h2>Reuniões e preparação essencial</h2>
                  </div>
                  <div className="head-note">
                    A manhã de 10/09 concentra dois controles jurídicos críticos e a preparação do marco de 11/09.
                  </div>
                </div>
                <div className="timeline">
                  ${briefing.meetings.map(
                    (meeting) => html`
                      <article className="event" key=${meeting.title}>
                        <div className="when">${meeting.time}</div>
                        <div>
                          <h3 className="title">${meeting.title}</h3>
                          <p className="body">${meeting.body}</p>
                          <ul className="prep">
                            ${meeting.prep.map((tip) => html`<li key=${tip}>${tip}</li>`)}
                          </ul>
                          ${meeting.href && html`<a className="link" href=${meeting.href} target="_blank" rel="noreferrer">Abrir evento</a>`}
                        </div>
                      </article>
                    `
                  )}
                </div>
              </section>

              <section className="panel">
                <div className="panel-head">
                  <div>
                    <div className="eyebrow">Inbox</div>
                    <h2>E-mails que realmente mexem no dia</h2>
                  </div>
                  <div className="head-note">
                    Itens promocionais e avisos sem efeito executivo foram excluídos.
                  </div>
                </div>
                <div className="list">
                  ${briefing.inbox.map(
                    (mail) => html`
                      <article className="mail" key=${mail.title}>
                        <div className="mail-meta">${mail.meta}</div>
                        <h3 className="title">${mail.title}</h3>
                        <p className="body">${mail.body}</p>
                        ${mail.href && html`<a className="link" href=${mail.href} target="_blank" rel="noreferrer">Abrir e-mail</a>`}
                      </article>
                    `
                  )}
                </div>
              </section>
            </div>

            <div className="stack">
              <section className="panel">
                <div className="panel-head">
                  <div>
                    <div className="eyebrow">Next Actions</div>
                    <h2>Follow-ups e donos</h2>
                  </div>
                </div>
                <div className="list">
                  ${briefing.todos.map(
                    (todo) => html`
                      <article className="todo" key=${todo.title}>
                        <div className="box"></div>
                        <div>
                          <h3 className="title">${todo.title}</h3>
                          <p className="body">${todo.body}</p>
                          <div className="owner">Owner: ${todo.owner}</div>
                          ${todo.href && html`<a className="link" href=${todo.href} target="_blank" rel="noreferrer">Abrir fonte</a>`}
                        </div>
                      </article>
                    `
                  )}
                </div>
              </section>

              <section className="panel">
                <div className="panel-head">
                  <div>
                    <div className="eyebrow">Riscos e bloqueios</div>
                    <h2>O que pede cuidado explícito</h2>
                  </div>
                </div>
                <div className="list">
                  ${briefing.risks.map(
                    (risk) => html`
                      <article className="risk" key=${risk.title}>
                        <h3 className="title">${risk.title}</h3>
                        <p className="body">${risk.body}</p>
                      </article>
                    `
                  )}
                </div>
              </section>

              <section className="panel">
                <div className="panel-head">
                  <div>
                    <div className="eyebrow">Cobertura</div>
                    <h2>Fontes e lacunas verificadas</h2>
                  </div>
                </div>
                <div className="list">
                  ${briefing.coverage.map(
                    (item) => html`
                      <article className="coverage" key=${item.title}>
                        <h3 className="title">${item.title}</h3>
                        <p className="body">${item.body}</p>
                      </article>
                    `
                  )}
                </div>
              </section>
            </div>
          </section>

          <section className="footer">
            <div className="footer-note">
              <strong>Leitura principal:</strong> o maior retorno desta manhã está em concluir e comprovar os atos
              de hoje, abrir a intimação criminal e responder ao cliente com plano verificável.
            </div>
            <div className="footer-note">
              <strong>Metodologia:</strong> Gmail consolidado, Google Calendar, Notion, memória de
              deduplicação, Manual de Marca e HTML aprovado. A versão pública é sanitizada; detalhes
              operacionais permanecem nos canais privados.
            </div>
          </section>
        </main>
      `;

      createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
